name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # The grammar's word lists are generated from Asili's compiler, which changes on its own
  # schedule: check weekly against Asili's develop so drift shows up without a push here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Test and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out Asili
        uses: actions/checkout@v7
        with:
          repository: Asili-Programming/Asili
          ref: develop
          path: .asili

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .asili

      - run: npm ci
      - name: Build platform-specific Pata servers
        env:
          ASILI_DIR: .asili
        run: npm run build-tools
      - run: npm run compile
      - run: npm test
      - run: npm run package

      - uses: actions/upload-artifact@v6
        with:
          name: asili-${{ matrix.os }}-vsix
          path: asili-*.vsix
          if-no-files-found: error

      - name: Grammar word lists match the compiler's
        if: runner.os == 'Linux'
        working-directory: .asili
        env:
          ASILI_VSCODE_DIR: ${{ github.workspace }}
        run: cargo test -p pata-core --test editor_word_lists
