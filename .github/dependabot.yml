version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/docs-tooling"
    schedule:
      interval: "weekly"
    ignore:
      # TypeDoc's peer range stops at TypeScript 6.0; 7 (the native compiler) breaks it.
      - dependency-name: "typescript"
        versions: [">= 7"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
